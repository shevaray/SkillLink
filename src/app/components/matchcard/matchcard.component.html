<div class="matchcard">
  <div class="matchcard__header d-flex items-start  gap-2 ">
    <div class="matchcard__avatar d-flex align-items-center justify-content-center">
      <span class="matchcard__initials">{{ initials }}</span>
    </div>
    <div class="matchcard__info">
      <div class="matchcard__name">{{ name }}</div>
      <div class="matchcard__match d-flex align-items-center gap-1">
        <span class="matchcard__match-dot"></span>
        <span class="matchcard__match-label">{{ matchLabel }}</span>
      </div>
    </div>
  </div>
  <div class="matchcard__body mb-3">
    <div class="matchcard__teaches mb-1">Teaches: <span>{{ teaches }}</span></div>
    <div class="matchcard__desc">{{ description }}</div>
  </div>
  <div class="matchcard__divider mb-3"></div>
  <div class="matchcard__footer d-flex flex-column">
    <div class="matchcard__learn">
      <div class="matchcard__learn-label">Wants to learn:</div>
      <div class="matchcard__learn-skill">{{ wantsToLearn }}</div>
    </div>
    <div class="matchcard__actions d-flex align-items-center gap-2">
      <button class="matchcard__btn matchcard__btn--primary" (click)="onConnectClick()">Connect</button>
      <button class="matchcard__btn matchcard__btn--outline" (click)="onViewProfile()">View Profile</button>
    </div>
  </div>
</div> 

<!-- Connect Modal -->
<app-connect-modal 
  [isVisible]="showConnectModal"
  [userDetails]="{
    id: userId,
    name: name,
    avatar: avatar,
    gender: gender,
    skillLevel: skillLevel
  }"
  (close)="onCloseConnectModal()"
  (scheduleSession)="onScheduleSession($event)"
  (message)="onMessage($event)"
></app-connect-modal>
