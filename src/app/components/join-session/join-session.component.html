<div class="modal-overlay" *ngIf="isVisible" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-content">
        <div class="title-section">
          <h2 class="modal-title">Share Meeting Link</h2>
          <p class="modal-subtitle">Choose a meeting link platform</p>
        </div>
        <button class="close-button" (click)="onClose()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.5 3.5L3.5 12.5M3.5 3.5L12.5 12.5" stroke="#6C57DB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="modal-body">
      <div class="platform-selection">
        <div 
          class="platform-option" 
          *ngFor="let platform of platforms"
          [class.selected]="platform.selected"
          (click)="selectPlatform(platform.id)"
        >
          <div class="platform-icon">
            <img *ngIf="platform.icon === 'video'" src="/assets/typcn_video.png" alt="" class="menu-icon">
            <img *ngIf="platform.icon === 'people'" src="/assets/fluent_people.png" alt="" class="menu-icon">
          </div>
          <span class="platform-name">{{ platform.name }}</span>
        </div>
      </div>

      <div class="meeting-link-section">
        <label class="link-label">Meeting Link:</label>
        <div class="link-container">
          <div class="link-input">
            <span class="link-text">{{ meetingLink }}</span>
          </div>
          <button class="copy-button" (click)="copyMeetingLink()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 2H2C1.45 2 1 2.45 1 3V13C1 13.55 1.45 14 2 14H10C10.55 14 11 13.55 11 13V11H13C13.55 11 14 10.55 14 10V2C14 1.45 13.55 1 13 1H6C5.45 1 5 1.45 5 2V4H4V2Z" stroke="#5C5858" stroke-width="2"/>
              <path d="M6 4H13V10H6V4Z" stroke="#5C5858" stroke-width="2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="share-button" (click)="shareLink()">
        Share Link
      </button>
      <button class="cancel-button" (click)="cancel()">
        Cancel
      </button>
    </div>
  </div>
</div>
