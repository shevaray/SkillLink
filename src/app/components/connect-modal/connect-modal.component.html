<div class="modal-overlay" *ngIf="isVisible" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Connect With {{ userDetails?.name || 'User' }}</h2>
      <button class="close-button" (click)="onClose()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.5 3.5L3.5 12.5M3.5 3.5L12.5 12.5" stroke="#6C57DB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="modal-body" *ngIf="userDetails">
      <div class="user-info">
        <div class="user-avatar">
          <img [src]="userDetails.avatar" [alt]="userDetails.name" class="avatar-image">
        </div>
        
        <div class="user-details">
          <h3 class="user-name">{{ userDetails.name }}</h3>
          
          <div class="user-badges">
            <div class="badge-item">
              <div class="badge-icon">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 9C11.25 9 13 7.25 13 5C13 2.75 11.25 1 9 1C6.75 1 5 2.75 5 5C5 7.25 6.75 9 9 9Z" fill="#6C57DB"/>
                  <path d="M9 11C6.25 11 4 13.25 4 16H14C14 13.25 11.75 11 9 11Z" fill="#6C57DB"/>
                </svg>
              </div>
              <span class="badge-text">{{ userDetails.gender }}</span>
            </div>
            
            <div class="badge-item">
              <div class="badge-icon">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 1L11.5 6L17 6.5L13 10.5L14 16L9 13L4 16L5 10.5L1 6.5L6.5 6L9 1Z" fill="#6C57DB"/>
                </svg>
              </div>
              <span class="badge-text">{{ userDetails.skillLevel }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="primary-button" (click)="onScheduleSession()">
        Schedule a session
      </button>
      <button class="secondary-button" (click)="onMessage()">
        Message
      </button>
    </div>
  </div>
</div>
