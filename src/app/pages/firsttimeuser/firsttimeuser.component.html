<div class="firsttimeuser-hero">
  <div class="firsttimeuser-hero__welcome d-flex align-items-center gap-3 mb-2">
    <span class="firsttimeuser-hero__welcome-text">Welcome Sarah,</span>
    <img src="/assets/waving-hand.svg" alt="Waving Hand" width="53" height="53" />
  </div>
  <div class="firsttimeuser-hero__subtitle mb-4">Let’s get your started with peer to peer skill exchange</div>
</div>

<div class="firsttimeuser-profile-card">
  <div class="firsttimeuser-profile-card__header d-flex align-items-center justify-content-between mb-3">
    <span class="firsttimeuser-profile-card__title">Profile Completion</span>
    <span class="firsttimeuser-profile-card__progress-label">Profile Progress</span>
  </div>
  <div class="firsttimeuser-profile-card__progress-bar mb-4">
    <div class="firsttimeuser-profile-card__progress-fill" style="width: 40%"></div>
  </div>
  <div class="firsttimeuser-profile-card__actions">
    <div class="firsttimeuser-profile-card__action done">
      <img src="/assets/check-grey.svg" alt="Check" width="24" height="24" />
      <span>Complete your profile</span>
    </div>
    <div class="firsttimeuser-profile-card__action done">
      <img src="/assets/check-grey.svg" alt="Check" width="24" height="24" />
      <span>Upload a Photo</span>
    </div>
    <div class="firsttimeuser-profile-card__action active">
      <img src="/assets/check-purple.svg" alt="Check" width="24" height="24" />
      <span>Update your public profile</span>
    </div>
    <div class="firsttimeuser-profile-card__action">
      <img src="/assets/check-grey.svg" alt="Check" width="24" height="24" />
      <span>Add skills you can teach</span>
    </div>
    <div class="firsttimeuser-profile-card__action">
      <img src="/assets/check-grey.svg" alt="Check" width="24" height="24" />
      <span>List skills you want to learn</span>
    </div>
  </div>
  <div class="firsttimeuser-profile-card__view-profile mt-4 d-flex align-items-center gap-2">
    <span>View Public Profile</span>
    <img src="/assets/arrow-up.svg" alt="Arrow Up" width="21" height="21" />
  </div>
</div>
