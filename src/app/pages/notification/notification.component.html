<div class="notification-container">
  <div class="notification-header">
    <h1 class="notification-title">Notifications</h1>
  </div>
  
  <div class="notification-list">
    <div
      class="notification-item"
      *ngFor="let notification of notifications"
      [class.new]="notification.isNew"
      (click)="onNotificationClick(notification.id)"
    >
      <div class="notification-avatar">
        <div class="avatar-circle">
          <span class="avatar-text">{{ notification.initials }}</span>
        </div>
      </div>
      <div class="notification-content">
        <div class="notification-text">
          <p class="notification-message">{{ notification.message }}</p>
          <span class="notification-time">{{ notification.time }}</span>
        </div>
      </div>
      <div class="notification-actions">
        <button class="more-options-btn" (click)="onMoreOptionsClick($event)">
          <svg width="18" height="4" viewBox="0 0 18 4" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="2" cy="2" r="2" fill="#333333"/>
            <circle cx="9" cy="2" r="2" fill="#333333"/>
            <circle cx="16" cy="2" r="2" fill="#333333"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
