<div class="container  edit-profile-container">
  <!-- Public Profile Section -->
  <div class="inner-container  justify-content-center mb-4">
    <div class="starter col-12 col-md-10 col-lg-8">
      <div class="card p-4 mb-4">
        <h4 class="fw-bold mb-3">Profile Information</h4>
        <form>
          <div class="controller row g-3">
            <div class="col-md-4">
              <label for="fullName" class="form-label">Full Name</label>
              <input id="fullName" type="text" class="form-control" placeholder="Full Name">
            </div>
            <div class="col-md-4">
              <label for="email" class="form-label">Email</label>
              <input id="email" type="email" class="form-control" placeholder="Email Address">
            </div>
          </div>
          <div class="d-flex justify-content-end mt-4">
            <button type="submit" class="add-picture-btn">Update Personal Information</button>
          </div>
        </form>
      </div>

      <!-- Password Information Section -->
      <div class="card p-4 mb-4">
        <h4 class="fw-bold mb-3">Password Information</h4>
        <form>
          <div class="controller row g-3">
            <div class="col-md-4">
              <label for="currentPassword" class="form-label">Current Password</label>
              <input id="currentPassword" type="password" class="form-control" placeholder="••••••••">
            </div>
            <div class="col-md-4">
              <label for="newPassword" class="form-label">New Password</label>
              <input id="newPassword" type="password" class="form-control" placeholder="••••••••">
            </div>
            <div class="col-md-4">
              <label for="confirmPassword" class="form-label">Confirm New Password</label>
              <input id="confirmPassword" type="password" class="form-control" placeholder="••••••••">
            </div>
          </div>
          <div class="d-flex justify-content-end mt-4">
            <button type="submit" class="add-picture-btn">Update Password</button>
          </div>
        </form>
      </div>

      <div class="card-container">
        <div class="card p-4 mb-4">
          <div>
            <h3 class="mb-1 fw-bold">Public Profile</h3>
            <div class="text-muted small">The information here will be displayed on the website</div>
          </div>
          <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="profile-con">
              <div class="col-12">
                <label for="bio" class="form-label">About Me*</label>
                <textarea id="bio" class="form-control" formControlName="bio" rows="3" placeholder="Describe yourself or your skills"></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">Gender*</label>
                <div class="d-flex gap-3">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male">
                    <label class="form-check-label" for="genderMale">Male</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                    <label class="form-check-label" for="genderFemale">Female</label>
                  </div>
                </div>
              </div>
              <div class="col-12">
                <label for="teaching" class="form-label">Teaching Style*</label>
                <textarea id="teaching" class="form-control" formControlName="teaching" rows="3" placeholder="Describe your Teaching style"></textarea>
              </div>
              <div class="col-12">
                <label for="skillsOffered" class="form-label">Skills I Offer*</label>
                <textarea id="skillsOffered" class="form-control" formControlName="skillsOffered" rows="3" placeholder="UI/UX Design, User research"></textarea>
              </div>
              <div class="col-12">
                <label for="skillsLearn" class="form-label">Skills I want to learn*</label>
                <textarea id="skillsLearn" class="form-control" formControlName="skillsLearn" rows="3" placeholder="Photography, Spanish"></textarea>
              </div>
              <div class="col-md-6" style="width: 100%;">
                <label for="skillsLevel" class="form-label">Skills Level*</label>
                <select id="skillsLevel" class="form-select">
                  <option>Beginner</option>
                  <option>Intermediate</option>
                  <option>Advanced</option>
                </select>
              </div>
              <!-- Scheduler inserted below -->
              <app-scheduler></app-scheduler>
              <!-- End Scheduler -->
            </div>
            
            <div class="d-flex justify-content-end mt-4">
              <button type="submit" class="add-picture-btn">Save Details</button>
            </div>
            
          </form>
        </div>
        <div class="items-con">
          <div class="profile-avatar">
             <button class="add-picture-btn">Add Picture</button>
            <img src="/assets/ix_user-profile.png" alt="Profile Avatar" class="rounded-circle" width="85" height="85"> 
          </div>
        </div>

      </div>

      
    </div>
  </div>
</div>
