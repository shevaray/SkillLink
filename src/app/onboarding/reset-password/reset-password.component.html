<div class="d-flex flex-column align-items-center justify-content-center">
  <div class="card shadow py-4 px-5" style="max-width: 550px; width: 550px;">
    <h3 class="mb-3 fw-semibold">Create a new Password</h3>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <input [type]="passwordVisible ? 'text' : 'password'" id="password" class="form-control" formControlName="password" placeholder="Password">
          <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()" tabindex="-1">
            <i class="bi" [ngClass]="passwordVisible ? 'bi-eye-slash' : 'bi-eye'" aria-label="Toggle password visibility"></i>
          </button>
        </div>
        <div *ngIf="submitted && resetForm.get('password')?.invalid" class="text-danger small mt-1">
          Password is required (min 8 characters).
        </div>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
        <div class="input-group">
          <input [type]="confirmPasswordVisible ? 'text' : 'password'" id="confirmPassword" class="form-control" formControlName="confirmPassword" placeholder="Confirm Password">
          <button type="button" class="btn btn-outline-secondary" (click)="toggleConfirmPasswordVisibility()" tabindex="-1">
            <i class="bi" [ngClass]="confirmPasswordVisible ? 'bi-eye-slash' : 'bi-eye'" aria-label="Toggle confirm password visibility"></i>
          </button>
        </div>
        <div *ngIf="submitted && (resetForm.get('confirmPassword')?.invalid || resetForm.errors?.['passwordMismatch'])" class="text-danger small mt-1">
          <span *ngIf="resetForm.get('confirmPassword')?.invalid">Please confirm your password.</span>
          <span *ngIf="resetForm.errors?.['passwordMismatch']">There is a password mismatch. Please reconfirm.</span>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Reset Password</button>
    </form>
  </div>
</div>
