<div class="d-flex flex-column align-items-center justify-content-center">
  <div class="card shadow p-4" style="max-width: 550px; width: 550px;">
    <h3 class="mb-4 fw-semibold">Reset Password</h3>
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input id="email" type="email" class="form-control" formControlName="email" placeholder="Email Address">
        </div>
        <div *ngIf="submitted && forgotForm.get('email')?.invalid" class="text-danger small mt-1">
          <span *ngIf="forgotForm.get('email')?.errors?.['required']">Email is required.</span>
          <span *ngIf="forgotForm.get('email')?.errors?.['email']">Please enter a valid email address.</span>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Reset Password</button>
    </form>
  </div>
</div>
